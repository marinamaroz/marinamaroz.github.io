project:
  type: website
  output-dir: docs          # GitHub Pages serves main branch /docs
  resources:
    - images/thumb/*
    - images/cut/*
    - images/works/*
    - images/details/*
    - images/portrait.jpg
    - scripts/site.js

website:
  title: "Marina Maroz"
  description: "Marina Maroz, graphic artist and printmaker from Minsk: mezzotint, soft ground etching and ex libris."
  site-url: https://marinamaroz.github.io
  favicon: images/favicon.svg
  page-navigation: false
  search: false

format:
  html:
    minimal: true
    css: styles/site.css
    toc: false
    anchor-sections: false
    title-block-banner: false
    include-in-header: partials/head.html
    include-before-body: partials/frame.html
    include-after-body: partials/foot.html
