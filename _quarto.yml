project:
  type: website
  output-dir: docs          # GitHub Pages serves main branch /docs

website:
  title: "Marina Maroz"
  description: "Marina Maroz, graphic artist and printmaker from Minsk: mezzotint, soft ground etching and ex libris."
  site-url: https://marinamaroz.github.io
  favicon: images/favicon.svg
  page-navigation: false
  search: false
  navbar:
    title: "Marina Maroz"
    right:
      - href: works.qmd
        text: Works
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
      - icon: instagram
        href: https://www.instagram.com/marozmarina
        aria-label: Instagram
  page-footer:
    left: "© 2026 Marina Maroz · All images © the artist"
    right: "Марына Мароз"

format:
  html:
    theme: [default, styles/base.scss, styles/paper.scss]
    lightbox: auto
    toc: false
    smooth-scroll: true
    anchor-sections: false
    link-external-newwindow: true
